<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prototypes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f9f9f9;
      color: #111;
      min-height: 100vh;
      padding: 60px 24px;
    }
    .wrap { max-width: 600px; margin: 0 auto; }
    header { margin-bottom: 40px; }
    header h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
    header p { font-size: 14px; color: #888; }
    header a { color: #888; }
    .card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 0;
      border-bottom: 1px solid #eee;
      text-decoration: none;
      color: inherit;
      transition: color .15s;
    }
    .card:first-child { border-top: 1px solid #eee; }
    .card:hover { color: #0066ff; }
    .num { font-size: 12px; color: #bbb; min-width: 36px; }
    .title { font-size: 15px; flex: 1; }
    .arrow { font-size: 16px; color: #ccc; }
    .card:hover .arrow { color: #0066ff; }
    .empty { color: #aaa; font-size: 14px; padding-top: 24px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Prototypes</h1>
      <p>Generated by the Prototype Agent ·
        <a href="https://github.com/vtmhieu/daily-briefing-agent" target="_blank">View repo</a>
      </p>
    </header>
    
    <a href="https://vtmhieu.github.io/daily-briefing-agent/prototypes/3/" class="card" target="_blank">
      <span class="num">#3</span>
      <span class="title">CRM dashboard for tracking sales leads</span>
      <span class="arrow">→</span>
    </a>
  </div>
</body>
</html>
