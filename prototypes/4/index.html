<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Flow | Apple-Inspired Scheduler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f5f5f7; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.3); }
        .card { background: white; border-radius: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.02); }
    </style>
</head>
<body class="text-slate-900 min-h-screen p-4 md:p-8">

    <div x-data="schedulerApp()" class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-end mb-10">
            <div>
                <h1 class="text-4xl font-bold tracking-tight">Good morning, <span x-text="name"></span></h1>
                <p class="text-slate-500 mt-2">Here is your optimized flow for today.</p>
            </div>
            <div class="glass px-6 py-3 rounded-full text-sm font-medium flex items-center gap-4">
                <span x-text="weather.temp"></span>
                <span class="w-px h-4 bg-slate-200"></span>
                <span x-text="weather.condition"></span>
            </div>
        </header>

        <!-- Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Task List -->
            <div class="md:col-span-2 space-y-4">
                <template x-for="(task, index) in tasks" :key="index">
                    <div class="card p-5 flex items-center gap-4 hover:shadow-lg transition-all cursor-pointer" 
                         @click="task.done = !task.done">
                        <div :class="task.done ? 'bg-green-500' : 'border-2 border-slate-200'" class="w-6 h-6 rounded-full flex items-center justify-center transition-colors">
                            <i data-lucide="check" class="text-white w-4 h-4" x-show="task.done"></i>
                        </div>
                        <div>
                            <p class="font-semibold" :class="task.done ? 'line-through text-slate-400' : ''" x-text="task.title"></p>
                            <p class="text-xs text-slate-400" x-text="task.time"></p>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Suggestions -->
            <div class="card p-6 bg-indigo-900 text-white">
                <h2 class="text-xl font-bold mb-6">World Pulse</h2>
                <div class="space-y-6">
                    <template x-for="rec in recommendations" :key="rec.title">
                        <div class="group cursor-pointer">
                            <span class="text-[10px] uppercase tracking-widest opacity-60 font-bold" x-text="rec.category"></span>
                            <h3 class="font-semibold mt-1" x-text="rec.title"></h3>
                            <p class="text-sm opacity-80 mt-1" x-text="rec.desc"></p>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <script>
        function schedulerApp() {
            return {
                name: 'Alex',
                weather: { temp: '72°F', condition: 'Sunny & Clear' },
                tasks: [
                    { title: 'Morning Deep Work Session', time: '09:00 AM', done: false },
                    { title: 'Review Global Design Trends', time: '11:00 AM', done: false },
                    { title: 'Quick Meditation Break', time: '01:00 PM', done: false },
                    { title: 'Project Sync Meeting', time: '02:30 PM', done: false }
                ],
                recommendations: [
                    { category: 'Wellbeing', title: 'Outdoor Walking', desc: 'Weather is perfect for a 15-minute walk to clear your head.' },
                    { category: 'Learning', title: 'Tech Trends 2024', desc: 'Global focus is shifting towards lightweight AI architecture.' },
                    { category: 'Focus', title: 'Monochrome Mode', desc: 'Reduce screen glare; the sky is exceptionally bright today.' }
                ],
                init() {
                    lucide.createIcons();
                }
            }
        }
    </script>
</body>
</html>
