<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Flow | Scheduler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://rsms.me/inter/inter.css');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

<div x-data="schedulerApp()" class="max-w-3xl mx-auto px-6 py-12">
    <!-- Header -->
    <header class="mb-10">
        <h1 class="text-3xl font-bold tracking-tight">Good <span x-text="timeOfDay"></span>, <span class="text-blue-600">Alex</span></h1>
        <div class="mt-4 flex items-center gap-6 p-4 bg-white border border-gray-200 rounded-xl shadow-sm">
            <div class="flex items-center gap-2">
                <i data-lucide="map-pin" class="w-4 h-4 text-gray-400"></i>
                <span class="text-sm font-medium">San Francisco, CA</span>
            </div>
            <div class="flex items-center gap-2">
                <i data-lucide="sun" class="w-4 h-4 text-amber-500"></i>
                <span class="text-sm font-medium" x-text="weather"></span>
            </div>
            <div class="ml-auto text-xs font-mono text-gray-400" x-text="dateString"></div>
        </div>
    </header>

    <!-- Suggestions Engine -->
    <section class="mb-10">
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-4">Contextual Suggestions</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <template x-for="item in suggestions" :key="item.id">
                <div class="bg-white p-5 rounded-xl border border-gray-200 hover:border-blue-400 transition-colors cursor-pointer group">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-semibold text-gray-900" x-text="item.title"></h3>
                        <span class="text-xs bg-gray-100 px-2 py-1 rounded text-gray-600" x-text="item.time"></span>
                    </div>
                    <p class="text-sm text-gray-500" x-text="item.desc"></p>
                </div>
            </template>
        </div>
    </section>

    <!-- Priority List -->
    <section>
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-4">Daily Priorities</h2>
        <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
            <template x-for="(task, index) in tasks" :key="index">
                <div class="flex items-center p-4 border-b border-gray-100 last:border-0 hover:bg-gray-50">
                    <div class="flex-shrink-0 w-8 text-center text-xs font-bold text-gray-400" x-text="index + 1"></div>
                    <div class="flex-grow">
                        <p class="text-sm font-medium text-gray-900" x-text="task.name"></p>
                    </div>
                    <div class="flex gap-1">
                        <button @click="rankUp(index)" class="p-1 hover:bg-gray-200 rounded"><i data-lucide="chevron-up" class="w-4 h-4"></i></button>
                        <button @click="rankDown(index)" class="p-1 hover:bg-gray-200 rounded"><i data-lucide="chevron-down" class="w-4 h-4"></i></button>
                    </div>
                </div>
            </template>
        </div>
    </section>
</div>

<script>
    function schedulerApp() {
        return {
            timeOfDay: 'Morning',
            weather: '72°F - Sunny & Clear',
            dateString: new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }),
            tasks: [
                { name: 'Prepare Q3 Quarterly Review' },
                { name: 'Deep Work: Code refactor' },
                { name: 'Lunch with engineering lead' },
                { name: 'Evening gym session' }
            ],
            suggestions: [
                { id: 1, title: 'Outdoor Walk', desc: 'Weather is perfect for a 15-min reset.', time: '12:00 PM' },
                { id: 2, title: 'Deep Work Focus', desc: 'Optimal energy levels detected.', time: '09:00 AM' }
            ],
            rankUp(index) {
                if (index > 0) {
                    let temp = this.tasks[index];
                    this.tasks[index] = this.tasks[index - 1];
                    this.tasks[index - 1] = temp;
                }
            },
            rankDown(index) {
                if (index < this.tasks.length - 1) {
                    let temp = this.tasks[index];
                    this.tasks[index] = this.tasks[index + 1];
                    this.tasks[index + 1] = temp;
                }
            },
            init() {
                lucide.createIcons();
                const hour = new Date().getHours();
                this.timeOfDay = hour < 12 ? 'Morning' : hour < 18 ? 'Afternoon' : 'Evening';
            }
        }
    }
</script>
</body>
</html>
